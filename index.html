<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Festa de Ano Novo</title>
<style>
  :root{--bg:#0e1230;--card:#181d47;--line:#2a3070;--gold:#f4c95d;--text:#f3f1ea;--mut:#a9aed6;--ok:#6fd49a;--no:#e98a8a}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#2a2f78,var(--bg));color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
  main{max-width:560px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:28px;margin:8px 0 4px;color:var(--gold);text-align:center}
  .sub{text-align:center;color:var(--mut);margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
  input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#10143a;color:var(--text);font-size:16px}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:#10143a;color:var(--text);font-size:15px;cursor:pointer}
  .seg button.on{background:var(--gold);color:#1a1a1a;border-color:var(--gold);font-weight:600}
  .stepper{display:flex;align-items:center;gap:12px}
  .stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#10143a;color:var(--text);font-size:22px;cursor:pointer}
  .stepper span{min-width:24px;text-align:center;font-size:18px}
  .go{width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:var(--gold);color:#1a1a1a;font-size:17px;font-weight:700;cursor:pointer}
  .ghost{background:none;border:0;color:var(--mut);cursor:pointer;font-size:13px;text-decoration:underline;padding:4px}
  .stats{display:flex;gap:8px;margin-bottom:16px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:24px;color:var(--gold)}
  .stat small{color:var(--mut)}
  h2{font-size:16px;margin:20px 0 8px;color:var(--gold)}
  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .row .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .row .name{font-weight:600}
  .tag{font-size:12px;color:var(--mut)}
  .meta{margin-top:6px;font-size:14px;color:var(--text)}
  .meta span{color:var(--mut)}
  .no .name{color:var(--no)}
  .sub-row{margin:-4px 0 8px 18px;padding:8px 12px;border-left:2px solid var(--gold);background:rgba(24,29,71,.6);border-radius:0 10px 10px 0;font-size:14px}
  .sub-row .tag{margin-left:4px}
  .msg{text-align:center;color:var(--mut);padding:12px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#0a2a18;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<main>
  <h1>🎆 Festa de Ano Novo</h1>
  <p class="sub">Confirme sua presença e diga o que vai levar</p>

  <div class="card">
    <div id="formTitle" style="font-weight:600">Sua confirmação</div>
    <label for="name">Seu nome</label>
    <input id="name" type="text" maxlength="80" placeholder="Ex.: Maria" autocomplete="off">

    <label>Você vai?</label>
    <div class="seg" id="statusSeg">
      <button type="button" data-v="vou" class="on">Vou 🎉</button>
      <button type="button" data-v="nao_vou">Não vou</button>
    </div>

    <div id="goingFields">
      <label>Quantas pessoas (contando você)?</label>
      <div class="stepper">
        <button type="button" id="minus">−</button><span id="guests">1</span><button type="button" id="plus">+</button>
        <span class="tag" id="guestsHint">sozinho(a)</span>
      </div>
      <div id="compBox"></div>

      <label for="food">Comida que vai levar <span class="tag">(opcional)</span></label>
      <input id="food" type="text" maxlength="120" placeholder="Ex.: Farofa, salpicão…" autocomplete="off">

      <label for="drink">Bebida que vai levar <span class="tag">(opcional)</span></label>
      <input id="drink" type="text" maxlength="120" placeholder="Ex.: 2 refris, espumante…" autocomplete="off">
    </div>

    <button class="go" id="save">Confirmar</button>
    <div style="text-align:center"><button class="ghost" id="cancelEdit" hidden>Cancelar edição</button></div>
  </div>

  <div class="stats">
    <div class="stat"><b id="sPeople">0</b><small>pessoas</small></div>
    <div class="stat"><b id="sFood">0</b><small>comidas</small></div>
    <div class="stat"><b id="sDrink">0</b><small>bebidas</small></div>
  </div>

  <div id="list"><div class="msg">Carregando…</div></div>
</main>
<div class="toast" id="toast"></div>

<script>
const URL_ = "https://ksucnjrmcagzepxahync.supabase.co/rest/v1/party_rsvp";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzdWNuanJtY2FnemVweGFoeW5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNDM0NDQsImV4cCI6MjEwODcxOTQ0NH0.BSj6kWbL7tt4Elea3YxNOlDUPmEiXkM1dURLHlU8Wzo";
const H = {apikey:KEY, Authorization:"Bearer "+KEY, "Content-Type":"application/json"};
const $ = id => document.getElementById(id);

let status = "vou", guests = 1, editingId = null, rows = [], companions = [];
const mine = () => { try { return JSON.parse(localStorage.getItem("festa_mine")||"[]"); } catch(e){ return []; } };
const addMine = id => { try { localStorage.setItem("festa_mine", JSON.stringify([...new Set([...mine(), id])])); } catch(e){} };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2200); }

function renderForm(){
  document.querySelectorAll("#statusSeg button").forEach(b=>b.classList.toggle("on", b.dataset.v===status));
  $("goingFields").style.display = status==="vou" ? "" : "none";
  $("guests").textContent = guests;
  $("guestsHint").textContent = guests===1 ? "sozinho(a)" : guests===2 ? "casal" : guests+" pessoas";
  const box = $("compBox");
  box.innerHTML = "";
  for(let i=0;i<guests-1;i++){
    const lab = document.createElement("label");
    lab.textContent = guests===2 ? "Nome do(a) acompanhante" : "Nome do(a) acompanhante "+(i+1);
    const inp = document.createElement("input");
    inp.type="text"; inp.maxLength=80; inp.autocomplete="off"; inp.placeholder="Ex.: João";
    inp.value = companions[i] || "";
    inp.oninput = () => { companions[i] = inp.value; };
    box.appendChild(lab); box.appendChild(inp);
  }
  $("formTitle").textContent = editingId ? "Editar confirmação" : "Sua confirmação";
  $("save").textContent = editingId ? "Salvar alterações" : "Confirmar";
  $("cancelEdit").hidden = !editingId;
}
document.querySelectorAll("#statusSeg button").forEach(b=>b.onclick=()=>{status=b.dataset.v;renderForm();});
$("minus").onclick=()=>{guests=Math.max(1,guests-1);renderForm();};
$("plus").onclick=()=>{guests=Math.min(10,guests+1);renderForm();};

function resetForm(){ editingId=null; status="vou"; guests=1; companions=[]; $("name").value=""; $("food").value=""; $("drink").value=""; renderForm(); }
$("cancelEdit").onclick=resetForm;

async function load(){
  try{
    const r = await fetch(URL_+"?select=*&order=created_at.asc", {headers:H});
    if(!r.ok) throw new Error(r.status);
    rows = await r.json();
    renderList();
  }catch(e){ $("list").innerHTML='<div class="msg">Não consegui carregar a lista. Tente atualizar a página.</div>'; }
}

function renderList(){
  const yes = rows.filter(r=>r.status==="vou"), no = rows.filter(r=>r.status!=="vou");
  $("sPeople").textContent = yes.reduce((a,r)=>a+r.guests,0);
  $("sFood").textContent = yes.filter(r=>r.food&&r.food.trim()).length;
  $("sDrink").textContent = yes.filter(r=>r.drink&&r.drink.trim()).length;
  const m = mine();
  const item = r => `
    <div class="row ${r.status==='vou'?'':'no'}">
      <div class="top">
        <div><span class="name">${esc(r.name)}</span> ${r.status==='vou' ? `<span class="tag">· ${r.guests===1?'1 pessoa':r.guests===2?'casal':r.guests+' pessoas'}</span>`:''}</div>
        ${m.includes(r.id) ? `<div><button class="ghost" data-edit="${r.id}">editar</button><button class="ghost" data-del="${r.id}">remover</button></div>`:''}
      </div>
      ${r.status==='vou' && (r.food||r.drink) ? `<div class="meta">${r.food?`🍽️ ${esc(r.food)}`:''}${r.food&&r.drink?'<br>':''}${r.drink?`🥂 ${esc(r.drink)}`:''}</div>`:''}
    </div>` + (r.status==='vou' ? (r.companions||[]).filter(c=>c&&c.trim()).map(c=>`<div class="sub-row">↳ ${esc(c)} <span class="tag">com ${esc(r.name)}</span></div>`).join('') : '');
  let h = "";
  if(yes.length) h += `<h2>Confirmados (${yes.length})</h2>` + yes.map(item).join("");
  if(no.length) h += `<h2>Não vão (${no.length})</h2>` + no.map(item).join("");
  $("list").innerHTML = h || '<div class="msg">Ninguém confirmou ainda. Seja o primeiro! 🎉</div>';
}

$("list").onclick = async e => {
  const ed = e.target.dataset.edit, del = e.target.dataset.del;
  if(ed){
    const r = rows.find(x=>x.id===ed); if(!r) return;
    editingId=r.id; status=r.status; guests=r.guests; companions=[...(r.companions||[])]; $("name").value=r.name; $("food").value=r.food||""; $("drink").value=r.drink||"";
    renderForm(); window.scrollTo({top:0,behavior:"smooth"});
  }
  if(del && confirm("Remover sua confirmação?")){
    await fetch(URL_+"?id=eq."+del, {method:"DELETE", headers:H});
    toast("Removido"); load();
  }
};

$("save").onclick = async () => {
  const name = $("name").value.trim();
  if(!name){ toast("Digite seu nome"); $("name").focus(); return; }
  const going = status==="vou";
  const comps = going ? Array.from({length:guests-1}, (_,i)=>(companions[i]||"").trim().slice(0,80)).filter(Boolean) : [];
  const body = { name, status, guests: going?guests:1, companions: comps, food: going?($("food").value.trim()||null):null, drink: going?($("drink").value.trim()||null):null };
  $("save").disabled = true;
  try{
    let r;
    if(editingId){
      r = await fetch(URL_+"?id=eq."+editingId, {method:"PATCH", headers:{...H,Prefer:"return=minimal"}, body:JSON.stringify(body)});
    }else{
      const id = crypto.randomUUID();
      r = await fetch(URL_, {method:"POST", headers:{...H,Prefer:"return=minimal"}, body:JSON.stringify({id,...body})});
      if(r.ok) addMine(id);
    }
    if(!r.ok) throw new Error(r.status);
    toast(editingId ? "Alterações salvas!" : "Presença confirmada! 🎉");
    resetForm(); await load();
  }catch(e){ toast("Erro ao salvar, tente de novo"); }
  $("save").disabled = false;
};

renderForm(); load(); setInterval(load, 20000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Festa de Ano Novo</title>
<style>
  :root{--bg:#0b0a10;--card:#17141f;--line:#2e2742;--gold:#c4a7ff;--text:#f1eef7;--mut:#a79fbd;--ok:#6fd49a;--no:#e98a8a}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#2b1f4a,var(--bg));color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
  main{max-width:560px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:28px;margin:8px 0 4px;color:var(--gold);text-align:center}
  .sub{text-align:center;color:var(--mut);margin:0 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
  input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0f0d15;color:var(--text);font-size:16px}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0f0d15;color:var(--text);font-size:15px;cursor:pointer}
  .seg button.on{background:var(--gold);color:#1a1a1a;border-color:var(--gold);font-weight:600}
  .stepper{display:flex;align-items:center;gap:12px}
  .stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#0f0d15;color:var(--text);font-size:22px;cursor:pointer}
  .stepper span{min-width:24px;text-align:center;font-size:18px}
  .go{width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:var(--gold);color:#1a1a1a;font-size:17px;font-weight:700;cursor:pointer}
  .ghost{background:none;border:0;color:var(--mut);cursor:pointer;font-size:13px;text-decoration:underline;padding:4px}
  .stats{display:flex;gap:8px;margin-bottom:16px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:24px;color:var(--gold)}
  .stat small{color:var(--mut)}
  h2{font-size:16px;margin:20px 0 8px;color:var(--gold)}
  .row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
  .row .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .row .name{font-weight:600}
  .tag{font-size:12px;color:var(--mut)}
  .meta{margin-top:6px;font-size:14px;color:var(--text)}
  .meta span{color:var(--mut)}
  .no .name{color:var(--no)}
  .sub-row{margin:-4px 0 8px 18px;padding:8px 12px;border-left:2px solid var(--gold);background:rgba(23,20,31,.7);border-radius:0 10px 10px 0;font-size:14px}
  .sub-row .tag{margin-left:4px}
  .photoBtn{display:inline-block;margin:0;padding:10px 14px;border:1px dashed var(--mut);border-radius:10px;color:var(--text);cursor:pointer;font-size:14px}
  .thumb{display:block;margin-top:8px;max-width:100%;max-height:160px;border-radius:10px;border:1px solid var(--line);object-fit:cover}
  #photoPrev{margin-top:8px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tabs button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;cursor:pointer}
  .tabs button.on{background:var(--gold);color:#1a1a1a;border-color:var(--gold);font-weight:700}
  .big{font-size:20px;color:var(--gold);font-weight:700}
  .pay{margin-top:6px;font-size:14px}
  .msg{text-align:center;color:var(--mut);padding:12px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#0a2a18;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<main>
  <h1>🎆 Festa de Ano Novo</h1>
  <p class="sub">Confirme sua presença e diga o que vai levar</p>

  <div class="tabs">
    <button type="button" class="on" data-tab="Presenca">🎉 Presença</button>
    <button type="button" data-tab="Gastos">💰 Gastos</button>
  </div>

  <div id="tabPresenca">
  <div class="card">
    <div id="formTitle" style="font-weight:600">Sua confirmação</div>
    <label for="name">Seu nome</label>
    <input id="name" type="text" maxlength="80" placeholder="Ex.: Maria" autocomplete="off">

    <label>Você vai?</label>
    <div class="seg" id="statusSeg">
      <button type="button" data-v="vou" class="on">Vou 🎉</button>
      <button type="button" data-v="nao_vou">Não vou</button>
    </div>

    <div id="goingFields">
      <label>Quantas pessoas (contando você)?</label>
      <div class="stepper">
        <button type="button" id="minus">−</button><span id="guests">1</span><button type="button" id="plus">+</button>
        <span class="tag" id="guestsHint">sozinho(a)</span>
      </div>
      <div id="compBox"></div>

      <label for="food">Comida que vai levar <span class="tag">(opcional)</span></label>
      <input id="food" type="text" maxlength="120" placeholder="Ex.: Farofa, salpicão…" autocomplete="off">
      <div style="margin-top:8px">
        <label class="photoBtn" for="foodFile">📷 Adicionar foto da comida</label>
        <input id="foodFile" type="file" accept="image/*" hidden>
        <div id="photoPrev" hidden><img id="photoImg" class="thumb" alt="Foto da comida"><br><button type="button" class="ghost" id="photoRm">remover foto</button></div>
      </div>

      <label for="drink">Bebida que vai levar <span class="tag">(opcional)</span></label>
      <input id="drink" type="text" maxlength="120" placeholder="Ex.: 2 refris, espumante…" autocomplete="off">

      <label>Amigo da onça 🐆</label>
      <div class="seg" id="oncaSeg">
        <button type="button" data-v="1">Vou participar</button>
        <button type="button" data-v="0" class="on">Não vou</button>
      </div>
      <div id="giftBox" hidden>
        <label>Quantos presentinhos vai levar?</label>
        <div class="stepper">
          <button type="button" id="gMinus">−</button><span id="giftsN">1</span><button type="button" id="gPlus">+</button>
        </div>
      </div>
    </div>

    <button class="go" id="save">Confirmar</button>
    <div style="text-align:center"><button class="ghost" id="cancelEdit" hidden>Cancelar edição</button></div>
  </div>

  <div class="stats">
    <div class="stat"><b id="sPeople">0</b><small>pessoas</small></div>
    <div class="stat"><b id="sFood">0</b><small>comidas</small></div>
    <div class="stat"><b id="sDrink">0</b><small>bebidas</small></div>
    <div class="stat"><b id="sGifts">0</b><small>presentes</small></div>
  </div>
  <div class="msg" id="oncaLine" style="padding:0 0 12px"></div>

  <div id="list"><div class="msg">Carregando…</div></div>
  </div>

  <div id="tabGastos" hidden>
    <div class="card">
      <div style="font-weight:600">Adicionar gasto</div>
      <label for="eItem">Item</label>
      <input id="eItem" type="text" maxlength="100" placeholder="Ex.: Copo descartável" autocomplete="off">
      <label for="eAmount">Valor (R$)</label>
      <input id="eAmount" type="text" inputmode="decimal" maxlength="10" placeholder="25,00" autocomplete="off">
      <label for="eBuyer">Quem comprou</label>
      <input id="eBuyer" type="text" maxlength="80" list="buyerList" placeholder="Ex.: Gabriel" autocomplete="off">
      <datalist id="buyerList"></datalist>
      <button class="go" id="eSave">Adicionar gasto</button>
    </div>

    <div class="card">
      <label for="eN" style="margin-top:0">Dividir entre quantas pessoas? <span class="tag" id="nHint"></span></label>
      <input id="eN" type="text" inputmode="numeric" maxlength="3" placeholder="automático" autocomplete="off">
      <div class="tag" style="margin-top:6px">Por padrão usa o total de pessoas confirmadas na aba Presença. Se quiser outro número, digite aqui (vale só neste aparelho).</div>
    </div>

    <div id="eSummary"></div>
    <div id="eList"></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const URL_ = "https://ksucnjrmcagzepxahync.supabase.co/rest/v1/party_rsvp";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzdWNuanJtY2FnemVweGFoeW5jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxNDM0NDQsImV4cCI6MjEwODcxOTQ0NH0.BSj6kWbL7tt4Elea3YxNOlDUPmEiXkM1dURLHlU8Wzo";
const devId = (() => { try { let d = localStorage.getItem("festa_dev"); if(!d){ d = Array.from(crypto.getRandomValues(new Uint8Array(2)), b=>b.toString(16).padStart(2,"0")).join("").toUpperCase(); localStorage.setItem("festa_dev", d); } return d; } catch(e){ return "????"; } })();
const whoNow = () => { try { return localStorage.getItem("festa_who") || ""; } catch(e){ return ""; } };
const H = {apikey:KEY, Authorization:"Bearer "+KEY, "Content-Type":"application/json", get "x-client-info"(){ return encodeURIComponent(devId+"|"+whoNow()); }};
const $ = id => document.getElementById(id);

let status = "vou", guests = 1, editingId = null, rows = [], companions = [], onca = false, gifts = 1, exps = [], foodPhoto = null;
const SUPA = "https://ksucnjrmcagzepxahync.supabase.co";
const STORE = SUPA + "/storage/v1/object/public/party-photos/";
const okPhoto = u => typeof u === "string" && u.startsWith(STORE);
const URL_E = "https://ksucnjrmcagzepxahync.supabase.co/rest/v1/party_expenses";
const mine = () => { try { return JSON.parse(localStorage.getItem("festa_mine")||"[]"); } catch(e){ return []; } };
const addMine = id => { try { localStorage.setItem("festa_mine", JSON.stringify([...new Set([...mine(), id])])); } catch(e){} };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2200); }

function renderForm(){
  document.querySelectorAll("#statusSeg button").forEach(b=>b.classList.toggle("on", b.dataset.v===status));
  $("goingFields").style.display = status==="vou" ? "" : "none";
  $("guests").textContent = guests;
  $("guestsHint").textContent = guests===1 ? "sozinho(a)" : guests===2 ? "casal" : guests+" pessoas";
  document.querySelectorAll("#oncaSeg button").forEach(b=>b.classList.toggle("on", (b.dataset.v==="1")===onca));
  $("giftBox").hidden = !onca;
  $("giftsN").textContent = gifts;
  $("photoPrev").hidden = !foodPhoto;
  if(foodPhoto) $("photoImg").src = foodPhoto;
  const box = $("compBox");
  box.innerHTML = "";
  for(let i=0;i<guests-1;i++){
    const lab = document.createElement("label");
    lab.textContent = guests===2 ? "Nome do(a) acompanhante" : "Nome do(a) acompanhante "+(i+1);
    const inp = document.createElement("input");
    inp.type="text"; inp.maxLength=80; inp.autocomplete="off"; inp.placeholder="Ex.: João";
    inp.value = companions[i] || "";
    inp.oninput = () => { companions[i] = inp.value; };
    box.appendChild(lab); box.appendChild(inp);
  }
  $("formTitle").textContent = editingId ? "Editar confirmação" : "Sua confirmação";
  $("save").textContent = editingId ? "Salvar alterações" : "Confirmar";
  $("cancelEdit").hidden = !editingId;
}
document.querySelectorAll("#statusSeg button").forEach(b=>b.onclick=()=>{status=b.dataset.v;renderForm();});
document.querySelectorAll("#oncaSeg button").forEach(b=>b.onclick=()=>{onca=b.dataset.v==="1";if(onca&&gifts<1)gifts=1;renderForm();});
$("gMinus").onclick=()=>{gifts=Math.max(1,gifts-1);renderForm();};
$("gPlus").onclick=()=>{gifts=Math.min(20,gifts+1);renderForm();};
$("minus").onclick=()=>{guests=Math.max(1,guests-1);renderForm();};
$("plus").onclick=()=>{guests=Math.min(10,guests+1);renderForm();};

function resetForm(){ editingId=null; status="vou"; guests=1; companions=[]; onca=false; gifts=1; foodPhoto=null; $("name").value=""; $("food").value=""; $("drink").value=""; renderForm(); }
$("cancelEdit").onclick=resetForm;

async function load(){
  try{
    const r = await fetch(URL_+"?select=*&order=created_at.asc", {headers:H});
    if(!r.ok) throw new Error(r.status);
    rows = await r.json();
    renderList();
  }catch(e){ $("list").innerHTML='<div class="msg">Não consegui carregar a lista. Tente atualizar a página.</div>'; }
}

function renderList(){
  const yes = rows.filter(r=>r.status==="vou"), no = rows.filter(r=>r.status!=="vou");
  $("sPeople").textContent = yes.reduce((a,r)=>a+r.guests,0);
  $("sFood").textContent = yes.filter(r=>r.food&&r.food.trim()).length;
  $("sDrink").textContent = yes.filter(r=>r.drink&&r.drink.trim()).length;
  const oncaYes = yes.filter(r=>r.onca);
  $("sGifts").textContent = oncaYes.reduce((a,r)=>a+(r.gifts||0),0);
  $("oncaLine").textContent = "🐆 Amigo da onça: " + oncaYes.length + (oncaYes.length===1?" participante":" participantes");
  renderExp();
  const m = mine();
  const item = r => `
    <div class="row ${r.status==='vou'?'':'no'}">
      <div class="top">
        <div><span class="name">${esc(r.name)}</span> ${r.status==='vou' ? `<span class="tag">· ${r.guests===1?'1 pessoa':r.guests===2?'casal':r.guests+' pessoas'}</span>`:''}</div>
        ${m.includes(r.id) ? `<div><button class="ghost" data-edit="${r.id}">editar</button><button class="ghost" data-del="${r.id}">remover</button></div>`:''}
      </div>
      ${r.status==='vou' && (r.food||r.drink||r.onca) ? `<div class="meta">${[r.food?`🍽️ ${esc(r.food)}`:'', r.drink?`🥂 ${esc(r.drink)}`:'', r.onca?`🐆 Amigo da onça · ${r.gifts} ${r.gifts===1?'presente':'presentes'}`:''].filter(Boolean).join('<br>')}</div>`:''}
      ${r.status==='vou' && okPhoto(r.food_photo) ? `<a href="${esc(r.food_photo)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(r.food_photo)}" alt="Foto de ${esc(r.food||'comida')}" loading="lazy"></a>`:''}
    </div>` + (r.status==='vou' ? (r.companions||[]).filter(c=>c&&c.trim()).map(c=>`<div class="sub-row">↳ ${esc(c)} <span class="tag">com ${esc(r.name)}</span></div>`).join('') : '');
  let h = "";
  if(yes.length) h += `<h2>Confirmados (${yes.length})</h2>` + yes.map(item).join("");
  if(no.length) h += `<h2>Não vão (${no.length})</h2>` + no.map(item).join("");
  $("list").innerHTML = h || '<div class="msg">Ninguém confirmou ainda. Seja o primeiro! 🎉</div>';
}

$("list").onclick = async e => {
  const ed = e.target.dataset.edit, del = e.target.dataset.del;
  if(ed){
    const r = rows.find(x=>x.id===ed); if(!r) return;
    editingId=r.id; status=r.status; guests=r.guests; companions=[...(r.companions||[])]; onca=!!r.onca; gifts=r.gifts>0?r.gifts:1; foodPhoto=okPhoto(r.food_photo)?r.food_photo:null; $("name").value=r.name; $("food").value=r.food||""; $("drink").value=r.drink||"";
    renderForm(); window.scrollTo({top:0,behavior:"smooth"});
  }
  if(del && confirm("Remover sua confirmação?")){
    await fetch(URL_+"?id=eq."+del, {method:"DELETE", headers:H});
    toast("Removido"); load();
  }
};

$("save").onclick = async () => {
  const name = $("name").value.trim();
  if(!name){ toast("Digite seu nome"); $("name").focus(); return; }
  try{ localStorage.setItem("festa_who", name); }catch(e){}
  const going = status==="vou";
  const comps = going ? Array.from({length:guests-1}, (_,i)=>(companions[i]||"").trim().slice(0,80)).filter(Boolean) : [];
  const body = { name, status, guests: going?guests:1, companions: comps, food_photo: going?foodPhoto:null, onca: going&&onca, gifts: going&&onca?gifts:0, food: going?($("food").value.trim()||null):null, drink: going?($("drink").value.trim()||null):null };
  $("save").disabled = true;
  try{
    let r;
    if(editingId){
      r = await fetch(URL_+"?id=eq."+editingId, {method:"PATCH", headers:{...H,Prefer:"return=minimal"}, body:JSON.stringify(body)});
    }else{
      const id = crypto.randomUUID();
      r = await fetch(URL_, {method:"POST", headers:{...H,Prefer:"return=minimal"}, body:JSON.stringify({id,...body})});
      if(r.ok) addMine(id);
    }
    if(!r.ok) throw new Error(r.status);
    toast(editingId ? "Alterações salvas!" : "Presença confirmada! 🎉");
    resetForm(); await load();
  }catch(e){ toast("Erro ao salvar, tente de novo"); }
  $("save").disabled = false;
};

/* ---------- Foto da comida ---------- */
function resizeImg(file){
  return new Promise((res,rej)=>{
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 900/Math.max(img.width,img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error("blob")), "image/jpeg", 0.8);
    };
    img.onerror = () => rej(new Error("img"));
    img.src = u;
  });
}
$("foodFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = "";
  if(!f) return;
  $("save").disabled = true; toast("Enviando foto…");
  try{
    const blob = await resizeImg(f);
    const name = crypto.randomUUID()+".jpg";
    const r = await fetch(SUPA+"/storage/v1/object/party-photos/"+name, {method:"POST", headers:{apikey:KEY, Authorization:"Bearer "+KEY, "Content-Type":"image/jpeg"}, body:blob});
    if(!r.ok) throw new Error(r.status);
    foodPhoto = STORE+name; renderForm(); toast("Foto adicionada!");
  }catch(err){ toast("Não consegui enviar a foto"); }
  $("save").disabled = false;
};
$("photoRm").onclick = () => { foodPhoto = null; renderForm(); };

/* ---------- Abas ---------- */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on", x===b));
  $("tabPresenca").hidden = b.dataset.tab!=="Presenca";
  $("tabGastos").hidden = b.dataset.tab!=="Gastos";
});

/* ---------- Gastos ---------- */
const brl = c => (c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const toCents = s => { const n = parseFloat(String(s).trim().replace(/\./g,"").replace(",",".")); return isFinite(n) && n>=0 ? Math.round(n*100) : null; };
const getN = () => { try { return parseInt(localStorage.getItem("festa_n")||"",10)||0; } catch(e){ return 0; } };
$("eN").value = getN() || "";
$("eN").oninput = () => { try { localStorage.setItem("festa_n", String(parseInt($("eN").value,10)||"")); } catch(e){} renderExp(); };

async function loadExp(){
  try{
    const r = await fetch(URL_E+"?select=*&order=created_at.asc", {headers:H});
    if(!r.ok) throw new Error(r.status);
    exps = await r.json(); renderExp();
  }catch(e){ $("eList").innerHTML='<div class="msg">Não consegui carregar os gastos. Tente atualizar a página.</div>'; }
}

function renderExp(){
  const auto = rows.filter(r=>r.status==="vou").reduce((a,r)=>a+r.guests,0);
  const n = getN() || auto;
  $("nHint").textContent = "(confirmadas: "+auto+")";
  // sugestões de nomes
  const names = [];
  rows.filter(r=>r.status==="vou").forEach(r=>{ names.push(r.name); (r.companions||[]).forEach(c=>c&&names.push(c)); });
  $("buyerList").innerHTML = [...new Set(names)].map(x=>`<option value="${esc(x)}">`).join("");

  const total = exps.reduce((a,e)=>a+Math.round(Number(e.amount)*100),0);
  if(!exps.length){ $("eSummary").innerHTML=""; $("eList").innerHTML='<div class="msg">Nenhum gasto lançado ainda.</div>'; return; }

  const per = n ? Math.round(total/n) : 0;
  const by = new Map();
  exps.forEach(e=>{
    const k = e.buyer.trim().toLowerCase();
    if(!by.has(k)) by.set(k,{name:e.buyer.trim(),spent:0});
    by.get(k).spent += Math.round(Number(e.amount)*100);
  });

  let h = `<div class="card"><div class="tag">Total gasto</div><div class="big">${brl(total)}</div>`;
  if(n){ h += `<div class="pay">Dividido entre <b>${n}</b> ${n===1?'pessoa':'pessoas'}: <b>${brl(per)}</b> para cada uma</div>`; }
  else { h += `<div class="pay tag">Ninguém confirmado ainda — digite quantas pessoas acima para ver a divisão.</div>`; }
  h += `</div>`;
  if(n){
    h += `<h2>Para quem vai o dinheiro</h2>`;
    [...by.values()].forEach(b=>{
      const each = Math.round(b.spent/n);
      const saldo = b.spent - per;
      h += `<div class="row"><div class="top"><span class="name">${esc(b.name)}</span><span class="tag">comprou ${brl(b.spent)}</span></div>
        <div class="pay">Cada pessoa paga <b>${brl(each)}</b> para ${esc(b.name)}</div>
        <div class="pay tag">${saldo>0?`No fim, ${esc(b.name)} recebe ${brl(saldo)} (já descontada a parte dele(a))`:saldo<0?`No fim, ${esc(b.name)} ainda paga ${brl(-saldo)}`:'Fica zerado'}</div></div>`;
    });
  }
  $("eSummary").innerHTML = h;
  $("eList").innerHTML = `<h2>Gastos lançados (${exps.length})</h2>` + exps.map(e=>`
    <div class="row"><div class="top"><div><span class="name">${esc(e.item)}</span><div class="tag">comprado por ${esc(e.buyer)}</div></div>
    <div style="text-align:right"><b>${brl(Math.round(Number(e.amount)*100))}</b><br><button class="ghost" data-edel="${esc(e.id)}">remover</button></div></div></div>`).join("");
}

$("eList").onclick = async e => {
  const id = e.target.dataset.edel;
  if(id && confirm("Remover este gasto?")){
    await fetch(URL_E+"?id=eq."+encodeURIComponent(id), {method:"DELETE", headers:H});
    toast("Removido"); loadExp();
  }
};

$("eSave").onclick = async () => {
  const item = $("eItem").value.trim(), buyer = $("eBuyer").value.trim(), cents = toCents($("eAmount").value);
  if(!item){ toast("Digite o item"); $("eItem").focus(); return; }
  if(cents===null || cents>10000000){ toast("Valor inválido"); $("eAmount").focus(); return; }
  if(!buyer){ toast("Diga quem comprou"); $("eBuyer").focus(); return; }
  $("eSave").disabled = true;
  try{
    const r = await fetch(URL_E, {method:"POST", headers:{...H,Prefer:"return=minimal"}, body:JSON.stringify({item, amount:(cents/100).toFixed(2), buyer})});
    if(!r.ok) throw new Error(r.status);
    toast("Gasto adicionado!");
    $("eItem").value=""; $("eAmount").value=""; // mantém o comprador para lançar vários itens seguidos
    await loadExp();
  }catch(e){ toast("Erro ao salvar, tente de novo"); }
  $("eSave").disabled = false;
};

renderForm(); load(); loadExp(); setInterval(()=>{load();loadExp();}, 20000);
</script>
</body>
</html>
